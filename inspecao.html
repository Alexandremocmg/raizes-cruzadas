<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inspeção de modelos</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #10141f; font-family: 'Nunito', sans-serif; }
    canvas { display: block; }
    #painel {
      position: fixed; top: 12px; left: 12px; width: min(310px, calc(100vw - 24px));
      max-height: calc(100vh - 24px); overflow: auto;
      background: rgba(255, 249, 238, 0.94); border-radius: 16px; padding: 14px 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25); color: #3a2f2a; font-size: 14px;
    }
    #painel h1 { font-size: 18px; margin: 0 0 6px; }
    #painel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #6d5d52; margin: 12px 0 2px; }
    #painel p { margin: 4px 0 8px; color: #6d5d52; }
    #painel button {
      display: block; width: 100%; margin: 6px 0 0; padding: 8px 12px; border-radius: 10px;
      border: 2px solid #eadcc6; background: #fff; font: 700 14px 'Nunito', sans-serif; cursor: pointer; text-align: left;
    }
    #painel button.ativo { border-color: #f3b94d; background: #fff5dc; }
    #painel input[type=range] { width: 100%; }
    #info { margin-top: 10px; font-size: 13px; color: #6d5d52; line-height: 1.5; }
    #recolher { position: absolute; top: 8px; right: 10px; width: auto !important; margin: 0 !important; padding: 2px 10px !important; }
    #painel.recolhido > :not(h1):not(#recolher) { display: none; }
    /* Janela estreita: painel embaixo, para não cobrir o personagem */
    @media (max-width: 760px) {
      #painel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 42vh; }
      #clipes { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="painel">
    <button id="recolher" onclick="this.parentElement.classList.toggle('recolhido'); this.textContent = this.parentElement.classList.contains('recolhido') ? '+' : '–'">–</button>
    <h1 id="titulo">Inspeção</h1>
    <p>Arraste para girar a câmera e use a roda do mouse para zoom. Ao lado está o jogador provisório, para comparar o tamanho.</p>
    <h2>Clipes</h2>
    <div id="clipes"></div>
    <h2>Velocidade <span id="velN">1.00×</span></h2>
    <input id="vel" type="range" min="0.1" max="2" step="0.05" value="1">
    <h2>Visual</h2>
    <button id="bFacetas">Facetas low-poly: <b>ligadas</b></button>
    <button id="bGirar">Girar o modelo: <b>desligado</b></button>
    <button id="bCamJogo">Ver com a câmera do jogo</button>
    <button id="bPerto">Ver de perto</button>
    <div id="info"></div>
  </div>
  <script src="src/aviso-arquivo.js"></script>
  <script type="module" src="src/inspecao.js"></script>
</body>
</html>
