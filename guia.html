<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guia do educador · Raízes Cruzadas</title>
  <meta name="description" content="Como usar o jogo Raízes Cruzadas com um grupo: roteiro de aula, perguntas para a conversa e cuidados.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
  <style>
    :root { --creme: #fff9ee; --tinta: #3a2f2a; --suave: #6d5d52; --ouro: #f3b94d; --linha: #eadcc6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3ead9; color: var(--tinta); font: 17px/1.65 'Nunito', system-ui, sans-serif; }
    header { background: #1d2540; color: #fff9ee; padding: 22px 16px; }
    header .in { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
    header a { color: #ffd27a; font-weight: 800; text-decoration: none; }
    header .nome { font-weight: 800; letter-spacing: .02em; font-size: 20px; }
    main { max-width: 820px; margin: 0 auto; padding: 28px 16px 70px; }
    #conteudo { background: var(--creme); border-radius: 20px; padding: 10px 32px 34px; box-shadow: 0 10px 30px rgba(40,30,20,.12); }
    h1 { font-size: 34px; line-height: 1.2; margin: 24px 0 8px; }
    h2 { font-size: 26px; margin: 38px 0 8px; padding-top: 10px; border-top: 2px solid var(--linha); }
    h3 { font-size: 20px; margin: 26px 0 4px; color: #8a5a1f; }
    p, li { margin: 8px 0; }
    ul { padding-left: 22px; }
    a { color: #8a5a1f; font-weight: 700; }
    hr { border: 0; border-top: 2px solid var(--linha); margin: 26px 0; }
    blockquote { margin: 14px 0; padding: 6px 18px; border-left: 4px solid var(--ouro); background: #fdf4e2; border-radius: 0 12px 12px 0; }
    table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 15.5px; }
    th, td { border: 1px solid var(--linha); padding: 9px 11px; text-align: left; vertical-align: top; }
    th { background: #f6ecd6; }
    code { background: #f6ecd6; padding: 1px 6px; border-radius: 6px; }
    .barra { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 0; }
    .barra button, .barra a.b {
      padding: 10px 16px; border-radius: 12px; border: 2px solid var(--linha); background: #fff;
      font: 800 15px 'Nunito', sans-serif; color: var(--tinta); cursor: pointer; text-decoration: none;
    }
    .barra .primario { background: var(--tinta); border-color: var(--tinta); color: #fff; }
    #erro { display: none; padding: 20px; }
    @media (max-width: 600px) { #conteudo { padding: 4px 18px 26px; } h1 { font-size: 28px; } body { font-size: 16px; } }
    @media print {
      body { background: #fff; font-size: 12pt; }
      header, .barra { display: none; }
      main { padding: 0; max-width: none; }
      #conteudo { box-shadow: none; padding: 0; background: #fff; }
      h2 { break-after: avoid; }
      table, blockquote { break-inside: avoid; }
      a { color: inherit; }
    }
  </style>
</head>
<body>
  <header>
    <div class="in">
      <span class="nome">🌱 Raízes Cruzadas</span>
      <a href="index.html">▶ Jogar</a>
    </div>
  </header>
  <main>
    <div class="barra">
      <a class="b primario" href="index.html">▶ Jogar o capítulo 1</a>
      <button onclick="window.print()">🖨 Imprimir ou salvar em PDF</button>
      <a class="b" href="https://github.com/Alexandremocmg/raizes-cruzadas/discussions/categories/show-and-tell" target="_blank" rel="noopener">💬 Contar como foi</a>
    </div>
    <article id="conteudo"><p>Carregando o guia…</p></article>
    <div id="erro">
      Não foi possível carregar o guia aqui. Você pode lê-lo
      <a href="https://github.com/Alexandremocmg/raizes-cruzadas/blob/main/docs/guia-do-educador.md">direto no GitHub</a>.
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    (async () => {
      const alvo = document.getElementById('conteudo');
      try {
        if (!window.marked) throw new Error('marked não carregou');
        const r = await fetch('docs/guia-do-educador.md');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        alvo.innerHTML = marked.parse(await r.text());
        // Links externos abrem em outra aba
        alvo.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
        document.title = alvo.querySelector('h1')?.textContent || 'Guia do educador · Raízes Cruzadas';
      } catch (e) {
        console.error('[guia]', e);
        alvo.style.display = 'none';
        document.getElementById('erro').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
